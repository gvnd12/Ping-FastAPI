<html>
  <body style="margin:0; padding:0; background-color:#575757;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#575757">
      <tr>
        <td align="center" style="padding:40px 0;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                 style="background-color:#282828; border:1px solid #000000; color:#ededed;
                        font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;">
            <tr>
              <td style="padding:40px;">
                <p style="margin:0 0 16px 0; font-weight:700; font-size:18px;">Hi {{ name }},</p>
                <p style="margin:0 0 16px 0;">
                  Welcome to <strong style="font-weight:700;">Ping</strong>! We're excited to have you on board.
                </p>
                <p style="margin:0 0 16px 0;">
                  Your account has been successfully created.
                </p>
                <p style="margin:0 0 24px 0;">
                  You can start exploring right away by logging in with your registered email address:
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                  <tr>
                    <td bgcolor="#ededed" style="border-radius:4px;">
                      <button
                         style="display:inline-block; padding:15px 30px; font-size:18px;cursor: pointer;
                                font-weight:800;
                                font-family:'Trebuchet MS','Lucida Sans Unicode','Lucida Grande','Lucida Sans',Arial,sans-serif;">
                        <a href="https://www.google.com/" data-auth="NotApplicable">Login</a>
                      </button>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0 0;">
                  Best regards,<br>
                  <strong style="font-weight:700;">Ping</strong>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
